<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title"><title id="title">Kamy Bot — identidade clara e gradiente do mascote</title><defs><linearGradient id="kamy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#71C8FF"/><stop offset=".5" stop-color="#E8BDF6"/><stop offset="1" stop-color="#9A8CF6"/></linearGradient></defs><rect width="1200" height="520" rx="28" fill="#F5F6FA"/><text x="70" y="74" fill="#5C58A5" font-family="Arial,sans-serif" font-size="18" letter-spacing="6">KAMY BOT / VISUAL IDENTITY</text><text x="70" y="135" fill="#201D2D" font-family="Arial,sans-serif" font-size="48" font-weight="700">Leve, luminoso e expressivo.</text><text x="72" y="177" fill="#6C687A" font-family="Arial,sans-serif" font-size="20">Interface clara com o degradê azul, rosa e lilás do mascote.</text><g font-family="Arial,sans-serif"><rect x="70" y="230" width="1060" height="58" rx="14" fill="#FFFFFF" stroke="#E1DFEA"/><text x="150" y="266" fill="#201D2D" font-size="21" font-weight="bold">Ivory</text><text x="1030" y="266" text-anchor="end" fill="#6C687A" font-size="17">#FFFFFF</text><rect x="70" y="300" width="1060" height="58" rx="14" fill="#F5F6FA" stroke="#E1DFEA"/><text x="150" y="336" fill="#201D2D" font-size="21" font-weight="bold">Mist</text><text x="1030" y="336" text-anchor="end" fill="#6C687A" font-size="17">#F5F6FA</text><rect x="70" y="370" width="1060" height="58" rx="14" fill="#171126"/><text x="150" y="406" fill="#FFFFFF" font-size="21" font-weight="bold">Midnight</text><text x="1030" y="406" text-anchor="end" fill="#FFFFFF" font-size="17">#171126</text><rect x="70" y="440" width="1060" height="58" rx="14" fill="url(#kamy)"/><text x="150" y="476" fill="#201D2D" font-size="21" font-weight="bold">Kamy Gradient</text><text x="1030" y="476" text-anchor="end" fill="#201D2D" font-size="17">Blue · Pink · Lilac</text></g></svg>